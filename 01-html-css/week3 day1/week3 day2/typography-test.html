<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>文字デザインの実験</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;700;900&display=swap');

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            background-color: #eee9e2;
            padding: 60px 30px;
        }

        h1 {
            font-family: "Roboto", Arial, sans-serif;
            font-size: 48px;
            letter-spacing: 3px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        
    </style>
</head>
<body>
    <section class="hero">
        <h1>CREATE YOUR STYLE.</h1>
        <p>
            自分らしいスタイルを見つけよう。<br>
            毎日の暮らしをもっと楽しく。<br>
            あなたらしいデザインを楽しもう。
        </p>
    </section>
</body>
</html>
