<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridギャラリーの実験</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            column-gap: 20px;
            row-gap: 10px;
        }

        .item {
            background-color: lightblue;
            height: 150px;
        }

        .wide {
            grid-column: span 2;
        }
        

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .wide {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <h1>PHOTO GALLERY</h1>

    <div class="gallery">
        <div class="item wide">写真1</div>
        <div class="item">写真2</div>
        <div class="item">写真3</div>
        <div class="item">写真4</div>
        <div class="item">写真5</div>
        <div class="item">写真6</div>
    </div>
</body>
</html>
