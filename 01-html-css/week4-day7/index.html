<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Apple</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Apple</h1>

        <nav>
            <a href="#top">TOP</a>
            <a href="#menu">MENU</a>
            <a href="#contact">CONTACT</a>
        </nav>

    </header>

    <main>

        <section class="hero" id="top">

            <div class="hero-intro" id="about">

                <div class="hero-content">
                    <h2>Think different.</h2>
                    <p>発想を変える</p>
                </div>

                <nav class="hero-links">
                    <a href="#menu">MENU</a>
                </nav>

            </div>

            <img class="hero-image" src="images/hajimarino.webp" alt="Appleの店">

        </section>

        <section id="menu">

            <h2>MENU</h2>

            <ul class="menu-list">

                <li class="menu-item"><img class="menu-image" src="images/cofe.jpg" alt="カフェラテ">

                    <div class="menu-name">
                        <h3>Cafe Latte</h3>
                        <p>150¥</p>
                    </div>

                </li>

                <li class="menu-item"><img class="menu-image" src="images/cofe2.jpg" alt="ブラックコーヒー">

                    <div class="menu-name">
                        <h3>Coffee</h3>
                        <p>150¥</p>
                    </div>
                    
                </li>

                <li class="menu-item"><img class="menu-image" src="images/cofe3.jpg" alt="クリームコーヒー">

                    <div class="menu-name">
                        <h3>Cream Coffee</h3>
                        <p>150¥</p>
                    </div>
                    
                </li>

                <li class="menu-item"><img class="menu-image" src="images/cofe4.jpg" alt="エスプレッソ">

                    <div class="menu-name">
                        <h3>Espresso</h3>
                        <p>150¥</p>
                    </div>
                    
                </li>

            </ul>

        </section>

       </main>

    <footer id="contact">
        <p>お問い合わせ：店頭で受け付けています。</p>
        <p>© 2026 Apple</p>
    </footer>
    
</body>
</html>
