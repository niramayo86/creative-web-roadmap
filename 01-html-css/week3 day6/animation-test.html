<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSアニメーションの実験</title>
    <style>
        body {
            padding: 60px;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: #60a5fa;

            animation: move 2s linear 3 normal forwards;
            animation-delay: 1s;
        }

        @keyframes move {
            0% {
                transform: translateX(0);
                background-color: #60a5fa;

            }

            50% {
                transform: translateX(100px) scale(1.2);
                background-color: #22c55e;
            }

            100% {
                transform: translateX(200px);
                background-color: #f97316;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
