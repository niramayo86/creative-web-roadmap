<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>box-sizingの実験</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        .box {
            width: 200px;
            padding: 40px;
            border: 5px solid black;
            background-color: lightblue;
            margin-bottom: 20px;
        }

        .second {
            box-sizing: content-box;
        }

        body {
            margin: 0;
        }

        h2 {
            margin: 0;
        }
    </style>
</head>
<body>
    <h2>1つ目の箱</h2>
    <div class="box">こんにちは！</div>

    <h2>2つ目の箱</h2>
    <div class="box second">こんにちは！</div>
</body>
</html>
