<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMA.</title>
    <style>
        
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #263f33;
            font-family: sans-serif;
        }

        header {
            background-color: #ffffff;
            height: 76px;
            max-width: 1120px;
            padding: 0 24px; 
            display: flex;
            justify-content: space-between;
            align-items: center; 
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            margin: 0;
        }

        .linkbar {
            display: flex;
            gap: 24px;
            font-size: 13px;
            letter-spacing: 0.05em;
        }

        a {
            color: #263f33;
            text-decoration: none;
        }

       
        .hero {
            background-color: #f5f1e9;
            width: 100%;
        }


        .hero-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 64px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 60px;
            min-height: 540px;
        }

        .hero-text {
            flex: 1;
        }

        #Tagline {
            font-size: 12px;
            letter-spacing: 0.1em;
            margin: 0 0 16px 0;
            color: #9a795d;
        }

        h2 {
            font-size: 54px;
            line-height: 1.1;
            margin: 0 0 20px 0;
        }

        .説明 {
            font-size: 16px;
            margin: 0 0 32px 0;
            color: #59685f;
        }

        button {
            background-color: #355f4b;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 14px 28px;
            font-size: 12px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: transform 0.3s ease-out, background-color 0.3s ease-out;
        }

        button:hover {
            background-color: #274637;
            transform: translate(0, -3px);
        }

        .hero-art {
            width: 420px;
            height: 360px;
            background-color: #d9e4dc;
            position: relative;
        }

        .big {
            width: 220px;
            height: 220px;
            background-color: #355f4b;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .small {
            width: 88px;
            height: 88px;
            background-color: #e3a57c;
            border-radius: 50%;
            position: absolute;
            top: 60px;
            right: 50px;
        }

        .hero-art p {
            font-size: 12px;
            color: #355f4b;
            position: absolute;
            left: 20px;
            bottom: 20px;
            margin: 0;
        }

        @media (max-width: 800px) {
            header {
                height: 64px;
                padding: 0 20px;
            }

           
            .hero-inner {
                padding: 32px 20px;
                gap: 28px;
                flex-direction: column;
            }

            h2 {
                font-size: 36px;
            }

            .hero-art {
                width: 100%;
                max-width: 420px;
                height: 250px;
            }

            .big {
                width: 160px;
                height: 160px;
            }

            .small {
                width: 60px;
                height: 60px;
                top: 40px;
                right: 45px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>NOMA.</h1>
        <div class="linkbar">
            <a href="#about">ABOUT</a>
            <a href="#collection">COLLECTION</a>
        </div>
    </header>
    
   
    <main class="hero">
        
        <div class="hero-inner">
            <div class="hero-text">
                <p id="Tagline">A BETTER EVERYDAY</p>
                <h2>Space for<br>simple living.</h2>
                <p class="説明">Thoughtful design for everyday moments.</p>
                <button>EXPLORE</button>
            </div>
            <div class="hero-art">
                <div class="big"></div>
                <div class="small"></div>
                <p>01 / LIVING</p>
            </div>
        </div>
    </main>
</body>
</html>
