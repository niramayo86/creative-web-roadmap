<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>positionの実験</title>
    <style>
        body {
            min-height: 1800px;
        }

        .box {
            width: 150px;
            height: 80px;
            background-color: lightblue;
            margin-bottom: 10px;
        }

        .badge {
            background-color: salmon;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .card {
            position: relative;
            width: 300px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">NEW</span>
        <h2>おすすめ商品</h2>
        <p>新商品が入荷しました！</p>
    </div>
</body>
</html>
