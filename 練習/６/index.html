<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS WORKSPACE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NEXUS WORKSPACE</h1>
        <p>自分らしく働ける、快適な場所。</p>
    </header>

    <main>
        <section>
            <h2>料金プラン</h2>
            <div class="plan">
                <div class="planlist" id="pickup1">
                    <h3>ドロップイン</h3>
                    <p>500円/時</p>
                </div>
                <div class="planlist" id="pickup2">
                    <h3>月額プラン</h3>
                    <p>12,000円/月</p>
                    <p id="osusume">おすすめ</p>
                </div>
                <div class="planlist" id="pickup3">
                    <h3>法人プラン</h3>
                    <p>要相談</p>
                </div>
            </div>
        </section>

         <section>
            <h2>施設の特徴</h2>
            <div class="about">
                <div class="aboutlist" id="about1">
                    <h3>高速Wi-Fi</h3>
                    <p>快適なネット環境</p>
                </div>
                <div class="aboutlist" id="about2">
                    <h3>電源完備</h3>
                    <p>各席で充電可能</p>
                </div>
                <div class="aboutlist" id="about3">
                    <h3>会議室</h3>
                    <p>打ち合わせに対応</p>
                </div>
                <div class="aboutlist" id="about4">
                    <h3>静かな空間</h3>
                    <p>集中できる作業環境</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
