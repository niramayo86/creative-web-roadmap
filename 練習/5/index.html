<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDORI WORKSPACE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="head">
            <h1>MIDORI WORKSPACE</h1>
            <p>あなたらしく、集中できる場所。</p>
        </div>
        <div class="time">
            <p>OPEN 8:00–22:00</p>
        </div>
    </header>
    <main>
        <section class="about">
            <h2>施設の特徴</h2>
            <div class="itemcard">
                <div class="item">
                    <h3>高速Wi-Fi</h3>
                    <p>快適なネット環境</p>
                </div>
                <div class="item">
                    <h3>電源完備</h3>
                    <p>各席で充電可能</p>
                </div>
                <div class="item">
                    <h3>静かな空間</h3>
                    <p>作業に集中できる</p>
                </div>
            </div>
        </section>
        <section class="plan">   
            <h2>料金プラン</h2>
            <div class="plancard">
                <div class="item" id="drop">
                    <h3>ドロップイン</h3>
                    <p>500円/時</p>
                </div>
                <div class="item" id="month">
                    <h3>月額プラン</h3>
                    <p>12,000円/月</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
